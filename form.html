<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register • Reiki Workshop</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.6);
        }

        .input-field {
            padding-left: 2.75rem !important;
        }

        @keyframes pulse-glow {

            0%,
            100% {
                opacity: 0.3;
                transform: scale(1);
            }

            50% {
                opacity: 0.5;
                transform: scale(1.1);
            }
        }

        .glow-sphere {
            animation: pulse-glow 6s infinite ease-in-out;
        }
    </style>
</head>

<body
    class="min-h-screen flex flex-col bg-gradient-to-br from-purple-900 via-purple-700 to-pink-600 relative overflow-x-hidden">

    <header class="w-full bg-white/10 backdrop-blur-lg border-b border-white/20 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex  items-center justify-between px-6 py-4">

            <!-- Logo -->
            <div class="flex items-center gap-3">
                <img src="https://lakshmi.omsritara.in/assets/logo.png" alt="Reiki Workshop Logo" class="h-14 ">

            </div>

            <!-- Contact Info -->
            <div
                class="flex flex-col md:flex-row items-center gap-2 md:gap-6 mt-4 md:mt-0 text-white text-sm md:text-base">
                <a href="#" class="flex items-center gap-2 hover:text-pink-200 transition">
                    <span class="text-base">📞</span> +91 99977 79735
                </a>
                <a href="mailto:info@reikihealing.com" class="flex items-center gap-2 hover:text-pink-200 transition">
                    <span class="text-base">📧</span> info@omsritara.com
                </a>
            </div>
        </div>
    </header>

    <!-- Content -->
    <main class="flex-grow flex items-center justify-center p-6 relative">
        <!-- Glow Effects -->
        <div class="glow-sphere absolute w-72 h-72 bg-pink-500 rounded-full blur-[100px] top-1/4 -left-20"></div>
        <div class="glow-sphere absolute w-80 h-80 bg-purple-500 rounded-full blur-[100px] bottom-1/4 -right-20"></div>

        <!-- Form Card -->
        <div
            class="relative w-full max-w-md glass-card rounded-3xl shadow-2xl p-8 transform transition-all duration-500 hover:shadow-pink-500/20">
            <!-- Heading -->
            <div class="text-center mb-8">
                <div
                    class="inline-block px-4 py-1.5 mb-4 text-xs font-semibold text-pink-200 uppercase tracking-widest bg-pink-500/20 rounded-full border border-pink-500/30">
                    Join the Journey
                </div>
                <h2 class="text-3xl font-bold text-white mb-2">Reiki Workshop</h2>
                <p class="text-white/70 text-sm">Secure your spot for the upcoming session</p>
            </div>

            <!-- Form -->
            <form id="leadForm" class="space-y-5">
                <!-- Message -->
                <p id="message" class="text-center text-sm font-medium h-4"></p>

                <div class="relative">
                    <span class="input-icon"><i class="fas fa-user-circle"></i></span>
                    <input type="text" name="name" placeholder="Full Name" required
                        class="w-full px-4 py-3 rounded-xl bg-white/10 text-white placeholder-white/40 outline-none border border-white/20 focus:border-pink-400 focus:ring-1 focus:ring-pink-400 transition input-field" />
                </div>

                <div class="relative">
                    <span class="input-icon"><i class="fas fa-mobile-alt ml-0.5"></i></span>
                    <input type="tel" name="mobile" placeholder="Mobile Number" required pattern="[0-9]{10}"
                        title="Please enter a 10-digit mobile number"
                        class="w-full px-4 py-3 rounded-xl bg-white/10 text-white placeholder-white/40 outline-none border border-white/20 focus:border-pink-400 focus:ring-1 focus:ring-pink-400 transition input-field" />
                </div>

                <div class="relative">
                    <span class="input-icon"><i class="fas fa-envelope"></i></span>
                    <input type="email" name="email" placeholder="Email Address" required
                        class="w-full px-4 py-3 rounded-xl bg-white/10 text-white placeholder-white/40 outline-none border border-white/20 focus:border-pink-400 focus:ring-1 focus:ring-pink-400 transition input-field" />
                </div>

                <div class="relative">
                    <span class="input-icon"><i class="fas fa-map-marker-alt ml-0.5"></i></span>
                    <input type="text" name="city" placeholder="Your City" required
                        class="w-full px-4 py-3 rounded-xl bg-white/10 text-white placeholder-white/40 outline-none border border-white/20 focus:border-pink-400 focus:ring-1 focus:ring-pink-400 transition input-field" />
                </div>

                <!-- Register Button -->
                <button id="submitBtn" type="submit"
                    class="w-full mt-6 py-4 rounded-xl font-bold text-white bg-gradient-to-r from-pink-500 via-purple-600 to-indigo-600 hover:from-pink-600 hover:to-indigo-700 transition duration-300 shadow-xl shadow-pink-900/40 relative overflow-hidden group">
                    <span class="relative z-10 flex items-center justify-center gap-2">
                        Register Now 🚀
                    </span>
                    <div
                        class="absolute inset-0 bg-white/20 transform -translate-x-full group-hover:translate-x-0 transition-transform duration-500">
                    </div>
                </button>

                <!-- Divider -->
                <div class="flex items-center gap-4 py-2">
                    <div class="h-px flex-grow bg-white/10"></div>
                    <span class="text-white/30 text-xs font-medium uppercase tracking-widest">Or Already Paid?</span>
                    <div class="h-px flex-grow bg-white/10"></div>
                </div>

                <!-- Razorpay Payment Button -->
                <button type="button" onclick="handlePayment()"
                    class="mt-4 relative inline-flex items-center justify-center gap-3 w-full py-4 text-xl font-bold text-white rounded-xl bg-gradient-to-r from-pink-500 to-purple-900 hover:text-white transition duration-300 group">
                    <span class="text-2xl group-hover:scale-110 transition">💳</span>
                    <span>Confirm Payment (₹11,999)</span>
                </button>
            </form>

            <div class="mt-8 flex items-center justify-center gap-2 text-white/40 text-xs italic">
                <span class="h-px w-8 bg-white/20"></span>
                <span>✨ Align your energy • Transform your life ✨</span>
                <span class="h-px w-8 bg-white/20"></span>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div
        class="fixed right-4 bottom-8 sm:right-6 sm:bottom-10 bg-gradient-to-r from-pink-500 to-purple-600 text-white text-sm md:text-base font-semibold px-5 py-3 rounded-full shadow-2xl animate-pulse border border-white/30 z-50">
        Limited Seats Only
    </div>
    <footer class="bg-white/10 backdrop-blur-lg border-t border-white/20 py-6 mt-auto">
        <div class="max-w-6xl mx-auto px-6 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="text-sm text-gray-100">© 2026 <a href="https://omsritara.in" target="_blank"
                    rel="noopener noreferrer" class="underline">Omsritara</a> • All rights reserved
            </div>
            <div class="flex items-center gap-4">
                <!-- <a href="#register" class="text-sm text-gray-700 hover:text-[var(--primary)] transition">Register</a> -->
            </div>
        </div>

        <script>
            const form = document.getElementById("leadForm");
            const message = document.getElementById("message");
            const btn = document.getElementById("submitBtn");

            function handlePayment() {
                // Track Event
                if (typeof fbq === 'function') {
                    fbq('track', 'Lead');
                }

                // Open Payment Link in New Tab
                window.open("https://rzp.io/rzp/rLoJp3c", "_blank");

                // Redirect current page to thank you after a delay 
                // Using a longer timeout to ensure the user sees the start of Razorpay in the other tab first
                setTimeout(() => {
                    window.location.assign("thank-you.html");
                }, 1000);
            }

            form.addEventListener("submit", async function (e) {
                e.preventDefault();

                const oldBtnText = btn.innerHTML;
                btn.innerHTML = `<i class="fas fa-circle-notch fa-spin"></i> Submitting...`;
                btn.disabled = true;
                message.innerText = "";

                const formData = new FormData(form);
                const payload = {
                    name: formData.get("name"),
                    email: formData.get("email"),
                    mobile: formData.get("mobile"),
                    city: formData.get("city"),
                    description: "Reiki Workshop Lead"
                };

                try {
                    const res = await fetch("https://lead-api.omsritara.in/user/create", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });

                    if (res.ok) {
                        message.innerText = "✅ Registration Successful! Please proceed to payment.";
                        message.className = "text-green-300 text-center text-sm mt-3 animate-pulse";
                        form.reset();
                    } else {
                        throw new Error("API Failure");
                    }
                } catch (error) {
                    console.error(error);
                    message.innerText = "❌ Something went wrong. Please try again.";
                    message.className = "text-red-300 text-center text-sm mt-3";
                } finally {
                    btn.innerHTML = oldBtnText;
                    btn.disabled = false;
                }
            });
        </script>
</body>

</html>
